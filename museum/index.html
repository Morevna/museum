<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="index.js" defer></script>
</head>

<body>
    <header class="header dark-section">
        <!-- Содержимое шапки -->
    </header>

    <main class="main">
        <section class="hero dark-section">
            <!-- Мона Лиза и надпись Welcome to the Louvre -->
            <div class="hero__content">
                <h1>Welcome to the Louvre</h1>
                <p>From the castle to the museum</p>
                <a href="#" class="btn">Discover the Louvre</a>
            </div>
            <div class="hero__slider">
                <!-- Простой слайдер (можно подключить библиотеку или сделать вручную) -->
                <img src="assets/mona-lisa.jpg" alt="Mona Lisa">
                <!-- Добавь сюда стрелки и точки навигации, если нужно -->
            </div>
        </section>

        <section class="virtual-tour">
            <!-- 6 карточек туров -->
        </section>

        <section class="picture-explore dark-section">
            <!-- Картины и описание -->
        </section>

        <section class="video-journey">
            <!-- Видеопревью -->
        </section>

        <section class="art-gallery dark-section">
            <!-- Галерея с сеткой изображений -->
        </section>

        <section class="buy-tickets">
            <!-- Блок покупки билетов -->
        </section>

        <section class="contacts">
            <!-- Адрес, карта -->
        </section>
    </main>

    <footer class="footer dark-section">
        <!-- Содержимое подвала -->
    </footer>
</body>

</html>
